wordpress_errors:
  note: >-
    The WordPress REST API on wahi.com uses the WordPress core error envelope,
    {"code":"rest_...","message":"...","data":{"status":<int>}} — e.g. rest_no_route (404),
    rest_forbidden (401/403), rest_invalid_param (400). These are WordPress core semantics
    inherited by Wahi's CMS, not codes Wahi defines or documents.
  envelope: '{"code":"<string>","message":"<string>","data":{"status":<int>}}'
  documented_by: https://developer.wordpress.org/rest-api/using-the-rest-api/
