  - name: amenities
    params: [garage, fireplace, airConditioning, allowPets]
  - name: status
    params: [active, newlyAdded, highestRatedSchools]
  detail: >-
    Filters are flat, typed query parameters with enums declared in-spec (propertyTypes,
    listingType). `active` defaults to true; setting it false returns sold listings only. Distance
