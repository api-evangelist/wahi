    The Listing Search API declares no securitySchemes and the AI plugin manifest declares
    auth.type "none". See authentication/wahi-authentication.yml.
idempotency:
  supported: false
  header: null
  detail: >-
    No idempotency key, no request-deduplication contract, and no write operations at all — the
    published API surface is a single GET. No `Idempotency` pointer is emitted for this provider.
pagination:
  style: window
  params:
  - name: first
    in: query
    type: integer
    description: Retrieve the first X items in the result set.
  - name: last
    in: query
    type: integer
    description: Retrieve the last X items in the result set.
  response_fields:
  - listings
  cursors: false
  total_count: false
  link_header: false
  detail: >-
    /search takes `first` and `last` window parameters. The declared ListingsResponse carries only
    a `listings` array — no total, no page metadata, no next/prev cursor, no Link header. There is
    no documented default or maximum page size.
sorting:
  params:
  - name: sortBy
    values: [relevance, date, distance, listDate, listPrice, price, soldDate, updatedOn]
    default: relevance
  - name: sortOrder
    values: [asc, desc]
    default: desc
filtering:
  style: flat-query-parameters
