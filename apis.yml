name: Wahi
kind: company
description: >-
  Wahi is a Toronto-headquartered Canadian digital real estate platform and
  licensed brokerage — Wahi Inc., trading as Wahi Realty Inc., Brokerage — founded
  in 2021 by Benjy Katchen. It runs a consumer home search, an instant home
  valuation estimate, market data products (Market Pulse, House Price Index), a
  Wahi Select REALTOR matching service and a cashback program across Ontario,
  British Columbia, Alberta, Nova Scotia, Saskatchewan and New Brunswick. Wahi
  sits in the challenger layer of the Canadian listings value chain and does not
  own the data it surfaces: Canadian residential listings run through CREA, the
  single national cooperative that operates REALTOR.ca and the Data Distribution
  Facility (DDF), and Wahi reaches that data as a member brokerage and through a
  commercial MLS connectivity vendor (Repliers) rather than by operating a feed of
  its own. Wahi runs no developer programme: there is no developer portal, no
  api./developer./developers./docs. subdomain (all fail DNS resolution), no API key
  or OAuth credential path, and no RESO Web API certification, RESO Data Dictionary
  certification, OData service or $metadata document anywhere on its hosts — Wahi
  appears in neither the RESO certificates directory nor RESO's Canadian membership
  roster. The Terms of Use expressly forbid automated access, crawling and scraping,
  and forbid collecting, copying, storing or redistributing MLS data. It does,
  however, publish two agent-facing artifacts that a portal-shaped search misses: a
  421KB llms.txt at https://wahi.com/llms.txt (Last-Updated 2025-07-20) and an
  OpenAI-style AI plugin manifest at /.well-known/ai-plugin.json that points to a
  genuine OpenAPI 3.0.1 "Listing Search API" at https://wahi.com/gpt/openapi.yaml —
  one anonymous searchListings operation with 30 typed filters over Canadian
  listings. The spec is still served; the server it names, api.prod.wahi.com/gpt,
  returns 404, so the contract is published but unserved. A live Apollo GraphQL
  endpoint exists at api.prod.wahi.com/graphql with introspection disabled and
  robots.txt disallowing it, and the stock WordPress REST API of the marketing CMS
  remains anonymously callable. Wahi is overwhelmingly an API consumer rather than a
  producer, but not a zero.
