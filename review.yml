actions:
  apisYmlCreated: true
  apisListed: 1
  openapiDirectoryCreated: true
  specsHarvested:
    - path: openapi/wahi-wp-json-discovery.json
      sourceURL: https://wahi.com/wp-json/
      fetched: '2026-07-26'
      httpStatus: 200
      bytes: 319414
      contentType: application/json; charset=UTF-8
      format: WordPress REST API discovery document (JSON)
      parsed: true
      parseNote: >-
        Verified with python3 json.load — parses cleanly, 223 routes across 14
        namespaces.
  reason: >-
    apis[] lists exactly one API. The internal GraphQL endpoint is excluded because
    it is undocumented and explicitly robots-disallowed, and listing it would
    misrepresent a private implementation detail as a developer product. The
    WordPress REST API is included because it is genuinely public, anonymously
    callable and self-describing, and omitting the only real machine-readable
    contract on the domain would be equally dishonest — but its description states
    plainly that it is CMS infrastructure with no real estate capability. No
    OpenAPI, Swagger, OData $metadata, AsyncAPI, Postman collection or SDK exists for
    any Wahi real estate capability.
